<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="From Rules to Agents: an interactive 8-hour AI foundations course with session plan, instructor and trainee notes, activities, tests and certification.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>From Rules to Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar; left rail of the ladder-ordered course; reading column with wide activity panels. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#E3E9E5; --ink:#15262B; --muted:#56696D; --line:#CFD8D3;
  --accent:#0C6573; --accent-ink:#FFFFFF; --accent-soft:#D3E9EA;
  --warm:#B8741A; --warm-soft:#F5E6CB; --good:#2A7A4B; --good-soft:#DAEEE1; --bad:#B03838; --bad-soft:#F6DEDB;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#152124; --surface-2:#1C2B2F; --ink:#E2EBE8; --muted:#97A9AA; --line:#2A3A3E;
  --accent:#55BCC8; --accent-ink:#052428; --accent-soft:#163A40;
  --warm:#E4A64C; --warm-soft:#382A13; --good:#5EC48B; --good-soft:#14301F; --bad:#EE7C7C; --bad-soft:#3B1B1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#152124; --surface-2:#1C2B2F; --ink:#E2EBE8; --muted:#97A9AA; --line:#2A3A3E;
  --accent:#55BCC8; --accent-ink:#052428; --accent-soft:#163A40;
  --warm:#E4A64C; --warm-soft:#382A13; --good:#5EC48B; --good-soft:#14301F; --bad:#EE7C7C; --bad-soft:#3B1B1B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.58}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,4.6vw,46px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(22px,3vw,28px);font-weight:700;letter-spacing:-.01em}
h3{font-size:20px;font-weight:700}
h4{font-size:16px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{width:100%;resize:vertical;min-height:70px}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent);width:100%}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1300px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.prog-bar{width:90px;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--accent)}

/* Shell */
.shell{max-width:1300px;margin:0 auto;padding-inline:20px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:40px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;max-height:calc(100vh - 70px);overflow:auto;padding-block:26px 40px}
.rail h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 0 6px 10px}
.rail h4:first-child{margin-top:0}
.rail a{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.3}
.rail a:hover{background:var(--surface-2)}
.rail a[aria-current="page"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.rail a .c{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.rail a[aria-current="page"] .c{color:var(--accent);font-weight:600}
.rail a .t{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rail a .done{color:var(--good);font-size:13px}
.rail .brk{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:2px 10px 2px 50px;opacity:.8}
.mobile-nav{display:none}
main{padding-block:30px 90px;min-width:0}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  .mobile-nav{display:flex;flex-direction:column;gap:4px;padding-bottom:6px}
  .mobile-nav .row{justify-content:space-between}
  .mobile-nav select{width:100%}
  .brand span{display:none}
  main{padding-block:14px 70px}
  .topbar{position:static}
  .topbar-in{padding:8px 16px;gap:10px}
  .brand b{font-size:16.5px}
  .topbar .prog{display:none}
  .seg button{padding:4px 11px;font-size:13.5px}
  .timer{top:env(safe-area-inset-top,0px)}
}
.skip{position:absolute;left:-9999px;top:8px;z-index:50;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:8px 12px}
.skip:focus{left:16px}
.resume-note{background:var(--accent-soft);color:var(--ink);padding:10px 14px;border-radius:8px;font-size:15px}
.warnline{color:var(--warm);font-size:14px}

/* Page blocks */
.page{display:flex;flex-direction:column;gap:28px}
.col{max-width:760px}
.lede{font-size:19px;line-height:1.5}
.prose{display:flex;flex-direction:column;gap:14px;max-width:720px}
.prose h3{margin-top:14px}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.prose blockquote{margin:6px 0;padding:14px 18px;background:var(--warm-soft);border-radius:var(--r);font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.3}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel.flat{background:transparent}
.label{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.label.acc{background:var(--accent-soft);color:var(--accent)}
.label.warm{background:var(--warm-soft);color:var(--warm)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:700;font-size:15px}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tbl-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
table.mini{font-size:14.5px}
table.mini th,table.mini td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.mini th{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.mini td.num{text-align:right}

/* Module header */
.mhead{display:flex;flex-direction:column;gap:12px}
.mhead .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.minilad{display:flex;gap:4px;align-items:flex-end;height:30px}
.minilad i{display:block;width:14px;border-radius:3px 3px 0 0;background:var(--surface-2)}
.minilad i.on{background:var(--accent)}
.minilad i.past{background:var(--accent-soft)}
.obj{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button.inst{color:var(--warm)}
.tabs button.inst[aria-selected="true"]{border-bottom-color:var(--warm);color:var(--warm)}
[data-mode="trainee"] .inst-only{display:none!important}
[data-mode="instructor"] .trainee-hint{display:none}

/* Flip diagram */
.flip{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.flip-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flip-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:92px}
.flip .box{padding:6px 12px;border-radius:7px;background:var(--surface-2);font-weight:700;font-size:15px}
.flip .box.strong{background:var(--accent);color:var(--accent-ink)}
.flip .op{color:var(--muted);font-family:var(--f-mono)}

/* Example & terms */
.example{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;max-width:760px}
.example p+p{margin-top:4px}
dl.terms{display:grid;grid-template-columns:minmax(140px,220px) minmax(0,1fr);gap:0;margin:0;max-width:760px}
dl.terms dt,dl.terms dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0}
dl.terms dt{font-weight:700;padding-right:14px}
@media (max-width:560px){dl.terms{grid-template-columns:minmax(0,1fr)} dl.terms dt{border:0;padding-bottom:0}}
.takeaways{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-width:760px}
.takeaways li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px}
.takeaways li::before{content:"✓";color:var(--good);font-weight:700}

/* Instructor */
.inst-wrap{display:flex;flex-direction:column;gap:22px;max-width:820px}
.inst-banner{background:var(--warm-soft);border-radius:var(--r);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.inst-banner b{color:var(--warm);font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ros td:first-child{font-family:var(--f-mono);white-space:nowrap;color:var(--warm);font-weight:600;width:70px}
.inst-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.say li{font-style:italic}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:16px;max-width:780px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.qcard .qn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qcard .qq{font-weight:700;font-size:17px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);padding:10px 14px;border-radius:8px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{padding:10px 14px;border-radius:8px;font-size:15px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.scorebox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.scorebox .big{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1}

/* Activities */
.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px}
.act-head{display:flex;flex-direction:column;gap:6px}
.cardlist{display:flex;flex-direction:column;gap:10px}
.ccard{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.ccard .row{justify-content:space-between}
.chipbtn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:14px}
.chipbtn:hover:not(:disabled){border-color:var(--accent)}
.chipbtn.right{background:var(--good-soft);border-color:var(--good)}
.chipbtn.wrong{background:var(--bad-soft);border-color:var(--bad)}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--surface-2);font-weight:700}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.no{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.warm{background:var(--warm-soft);color:var(--warm)}
.canvas-wrap{width:100%;position:relative}
.canvas-wrap canvas{display:block;width:100%;border-radius:8px;background:var(--bg)}
.ctrl{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.ctrl label{display:flex;justify-content:space-between;font-size:14px;gap:10px}
.ctrl label b{font-family:var(--f-mono);font-weight:600}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(90px,160px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);transition:width .25s}
.bar .tr i.w{background:var(--warm)}
.bar .pct{font-family:var(--f-mono);font-size:12.5px;text-align:right}
@media (prefers-reduced-motion: reduce){.bar .tr i{transition:none}}

.pgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;width:100%;max-width:300px;aspect-ratio:1;touch-action:none;user-select:none}
.pgrid div{background:var(--surface-2);border-radius:3px}
.pgrid div.on{background:var(--ink)}
.pix-layout{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:640px){.pix-layout{grid-template-columns:minmax(0,1fr)}}

.gen-out{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.3}
.trace{display:flex;flex-wrap:wrap;gap:6px}
.trace span{font-size:13px;padding:3px 8px;border-radius:6px;background:var(--surface-2)}
.trace span sub{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-left:3px}

.agent-log{display:flex;flex-direction:column;gap:10px}
.astep{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.astep .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.astep .tool{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);padding:2px 7px;border-radius:5px}
pre.prompt{white-space:pre-wrap;font-family:var(--f-mono);font-size:13.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0;max-height:320px;overflow:auto}

/* Overview */
.hero{display:flex;flex-direction:column;gap:18px;padding-block:6px 4px}
.hero h1{max-width:16ch}
.ladder{display:flex;flex-direction:column;gap:6px;max-width:860px}
.rung{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.rung:hover{border-color:var(--accent)}
.rung .n{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--accent);text-align:center}
.rung .nm{font-weight:700;font-size:16.5px}
.rung .gs{font-size:14.5px;color:var(--muted)}
.rung .go{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-width:860px}

/* Plan */
.plan td,.plan th{padding:10px 12px}
.plan tr.brk td{background:var(--surface-2);color:var(--muted);font-family:var(--f-mono);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:5px;margin:2px 4px 2px 0;background:var(--surface-2)}
.tag.Lecture{background:var(--accent-soft);color:var(--accent)}
.tag.Activity,.tag.Simulation,.tag.Practice,.tag.Team.exercise{background:var(--warm-soft);color:var(--warm)}
.tag.Assessment{background:var(--good-soft);color:var(--good)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checklist label{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start}

/* Exam */
.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r)}
.timer .num{font-size:20px;font-weight:600}
.exam-opts label{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.exam-opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.exam-opts input{accent-color:var(--accent);margin-top:3px}
.cert-img{max-width:100%;border-radius:6px;border:1px solid var(--line);display:block}
.inline-confirm{background:var(--warm-soft);padding:14px;border-radius:8px;display:flex;flex-direction:column;gap:10px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.pager a{text-decoration:none;display:flex;flex-direction:column;gap:2px;max-width:48%}
.pager a b{color:var(--ink)}
.pager a.next{text-align:right;margin-left:auto}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:700;font-size:14.5px}
.field small{color:var(--muted);font-size:13px}
@media (max-width:900px){.timer{top:env(safe-area-inset-top,0px)}}
@media (max-width:420px){.brand b{font-size:15px}.seg button{padding:4px 9px;font-size:13px}.topbar-in{gap:6px}}
</style>
</head>
<body>

<button type="button" class="skip" id="skip">Skip to content</button>

<p class="lede">Today you will trace how software went from following hand-written rules to systems that learn, create and act. You do not need maths or programming. You need curiosity and examples from your own work.</p>
<h3>The one idea to carry all day</h3>
<p>For fifty years, software worked by <strong>explicit specification</strong>: a person wrote the rules and the machine executed them exactly. Modern AI turns this around. A person supplies <strong>examples, objectives or context</strong>, and a statistical model produces an answer, prediction or action, even for cases nobody wrote a rule for.</p>

<p>At the end of the day you will sit a 25-question final assessment (pass mark 70%) and your team will complete an AI Opportunity Canvas that your instructor scores. The Certification page has the full rules.</p>`,

{id:'m1', code:'M1', title:'The Big Shift: From Rules to Learning', rung:1, start:'09:30', end:'10:20', mins:50, methods:['Lecture','Activity','Discussion'],
objectives:['Describe how rule-based software works and where it is the right tool','Explain why some tasks cannot be captured in rules','Explain the three business consequences of learning from data'],
notes:`
<h3>The old way: explicit specification</h3>
<p>In traditional software a programmer writes every rule. A payroll system says: <em>pay = hours × rate; hours over 40 are paid at 1.5 ×</em>. Give it the same input and it gives the same output, every time. This is called <strong>deterministic</strong> behaviour.</p>
<p>Rules are excellent when the logic is <strong>known, stable, complete and must be exact</strong>: tax, pricing, unit conversion, access control, return policies. Most of the world’s software still works this way, and should.</p>
<h3>Where rules break</h3>
<p>Try writing the rules for “is this customer review happy?” You might start with “contains <em>great</em> → happy”. Then a customer writes “Oh great, another 40-minute queue.” You add a rule for sarcasm. Then “not bad at all” gets flagged as negative because it contains <em>bad</em>. Every fix breaks something else.</p>
<p>Recognising a face, hearing a word, judging whether a mango is ripe: you can do these easily but you cannot write down how. The philosopher Michael Polanyi called this “we know more than we can tell”.</p>
<h3>The new way: learning from examples</h3>
<p>Instead of rules, we give the computer <strong>examples</strong> (thousands of reviews already marked happy or unhappy), an <strong>objective</strong> (get as many right as possible) and sometimes <strong>context</strong> (instructions, documents). A statistical model finds the patterns itself, then applies them to reviews it has never seen.</p>
<p>Think of how a child learns the word “dog”. Nobody gives them a definition with four legs, fur and a tail. They see many dogs, are corrected when they call a cat a dog, and soon recognise breeds they have never met.</p>
<div class="flip">
  <div class="flip-row"><span class="flip-tag">Traditional</span><span class="box">Rules</span><span class="op">+</span><span class="box">Data</span><span class="op">→</span><span class="box strong">Answers</span></div>
  <div class="flip-row"><span class="flip-tag">Learning</span><span class="box">Examples</span><span class="op">+</span><span class="box">Objectives &amp; context</span><span class="op">→</span><span class="box strong">Model</span><span class="op">→</span><span class="box">Answers for new cases</span></div>
</div>
<h3>Three business consequences</h3>
<ol>
<li><strong>Faster to build.</strong> Behaviour comes from data and instructions rather than hand-coding every case, so a working prototype can take days instead of months.</li>
<li><strong>Probabilistic, not deterministic.</strong> The system gives the most likely answer. It can be right 95% of the time and still be wrong on the next case. You design for review, measure accuracy, and decide what happens when it is wrong.</li>
<li><strong>The model and the company are separate assets.</strong> A few companies build very large models; thousands of companies build products on top of them. Think engine and car. A company’s edge comes from its data, its workflows and its customers, not from owning the engine.</li>
</ol>
<h3>Rules and learning live together</h3>
<p>Real systems combine both. A store scheduling system uses rules for labour law and break times, and learning to forecast how busy Saturday will be.</p>`,

{id:'m2', code:'M2', title:'Machine Learning: Finding Patterns in Tables', rung:2, start:'10:35', end:'11:25', mins:50, methods:['Lecture','Demo','Activity'],
objectives:['Describe machine learning as pattern-finding on structured data','Use the words feature, label, training and testing correctly','Tell supervised, unsupervised and reinforcement learning apart','Name four ways a model goes wrong'],
notes:`
<h3>What machine learning is</h3>
<p>Machine learning (ML) is <strong>statistical pattern-finding on structured data</strong>: data that fits in rows and columns, like a spreadsheet. Each row is one example (one day, one customer, one loan). The columns are <strong>features</strong>, the inputs, such as temperature or day of the week. One column is the <strong>label</strong>, the thing we want to predict, such as how many customers came in.</p>
<h3>How a model learns, in four steps</h3>
<ol>
<li><strong>Collect examples.</strong> Two years of daily store data.</li>
<li><strong>Choose what to predict.</strong> Tomorrow’s footfall.</li>
<li><strong>Let the algorithm adjust itself</strong> to reduce its error. It guesses, checks how wrong it was, nudges its settings, and repeats thousands of times.</li>
<li><strong>Test it on examples it has never seen.</strong> If it only does well on the data it trained on, it has memorised, not learned.</li>
</ol>
<p>A new store manager does the same thing. After a few months they know Saturdays are busy, rainy days are quiet, and a promotion brings a rush. Nobody gave them a formula; they saw enough days.</p>
<h3>Three flavours</h3>
<ul>
<li><strong>Supervised learning</strong>: examples come with the right answers. Past loans marked “repaid” or “defaulted”. Most business ML is this.</li>
<li><strong>Unsupervised learning</strong>: no answers given. The model groups similar things, for example discovering five types of shopper from purchase history.</li>
<li><strong>Reinforcement learning</strong>: learning by trial, error and reward, like training a dog with treats. Used for game-playing, robot movement and some pricing systems.</li>
</ul>
<h3>What can go wrong</h3>
<ul>
<li><strong>Garbage in, garbage out.</strong> Missing or wrong data gives confident wrong answers.</li>
<li><strong>Bias from history.</strong> A hiring model trained on ten years of past decisions will copy past prejudice.</li>
<li><strong>Overfitting.</strong> Like a student who memorises last year’s exam answers and fails a new exam.</li>
<li><strong>Drift.</strong> The world changes. Many demand forecasts broke overnight in March 2020 because the past no longer described the present.</li>
</ul>`,

{id:'m3', code:'M3', title:'Deep Learning: Seeing, Hearing and Reading', rung:3, start:'11:25', end:'12:10', mins:45, methods:['Lecture','Activity'],
objectives:['Explain why images, audio and text are hard for classic ML','Describe a neural network as layers that build simple features into complex ones','Name the three ingredients behind deep learning’s rise','State two trade-offs of deep learning'],
notes:`
<h3>Why unstructured data is hard</h3>
<p>A table has a column called “temperature”. A photo has no column called “cat”. A 12-megapixel phone photo is 36 million numbers (red, green and blue for every pixel). A one-second voice clip is tens of thousands of air-pressure readings. The meaning is spread across all of them.</p>
<h3>Neural networks in plain words</h3>
<p>A neural network is built from many simple units, loosely inspired by brain cells. Each unit takes in numbers, weighs how important each one is, and passes a signal on. Units are arranged in <strong>layers</strong>. Stack many layers and you have a <strong>deep</strong> network.</p>
<p>The magic is that the layers learn their own jobs:</p>
<ul>
<li>Early layers learn to spot <strong>edges and colours</strong>.</li>
<li>Middle layers combine those into <strong>shapes and parts</strong>: an eye, a wheel, a corner of a label.</li>
<li>Late layers combine parts into <strong>whole things</strong>: a face, a car, a packet of biscuits.</li>
</ul>
<p>Nobody tells the network which features to look for. It discovers them from examples, which is why this is called <em>representation learning</em>.</p>
<p><strong>Analogy:</strong> a relay of inspectors in a mango-packing plant. The first only checks colour patches. The second looks at the first one’s notes and checks shape. The third combines both and says “ripe” or “not yet”. No single inspector knows everything; the chain does.</p>
<h3>Why it took off around 2012</h3>
<ol>
<li><strong>Big data</strong>: billions of labelled photos, recordings and pages on the internet.</li>
<li><strong>Cheap parallel computing</strong>: GPUs, chips built for video games, turned out to be ideal for the millions of small calculations networks need.</li>
<li><strong>Better techniques</strong>: researchers found ways to train very deep networks reliably.</li>
</ol>
<p>In 2012 a deep network called AlexNet beat every other approach in a famous image-recognition contest by a wide margin, and the field shifted almost overnight.</p>
<h3>Trade-offs</h3>
<ul>
<li>Needs large amounts of data and computing power.</li>
<li>Hard to explain <em>why</em> it made a decision (the “black box” problem).</li>
<li>Can be fooled by small changes a person would ignore, such as a few stickers on a stop sign.</li>
</ul>`,
example:{title:'The shelf-scanning camera', html:`<p>A camera photographs each aisle every hour. A deep learning model recognises each product, compares the photo with the planned layout, and spots gaps and misplaced items. An associate gets a task on their handheld: “Aisle 7, bay 3: restock 500 g basmati rice.” Twenty years ago this would have needed a person walking every aisle with a clipboard.</p>`},

{id:'m4', code:'M4', title:'Generative AI: From Recognising to Creating', rung:4, start:'12:55', end:'13:40', mins:45, methods:['Activity','Lecture','Discussion'],
objectives:['Tell classifying models from generative models','Explain in plain words how a generative model creates something new','List three good uses and four risks','Apply the rule “AI drafts, people decide”'],
notes:`
<h3>Classify versus create</h3>
<p>The models so far answer <em>which bucket?</em> Is this email spam? Is this a cat? How many visitors tomorrow? A <strong>generative</strong> model answers <em>make me one</em>. Write an email. Draw a cat. Compose a jingle. It produces new content that resembles what it learned from, but is not a copy.</p>
<h3>How it creates</h3>
<p>A generative model learns the patterns of its training data so well that it can produce new, plausible examples, one piece at a time.</p>
<ul>
<li><strong>Text</strong> is produced word by word: at each step, the model picks a likely next word given everything so far (you will see this in detail in M6).</li>
<li><strong>Images</strong> are often made by <em>diffusion</em>: start from random static, then remove noise step by step, guided by your description, until a picture appears. Like a photograph slowly developing in a darkroom.</li>
</ul>
<p>Because it samples from likelihoods, the same request can give different results. That is a feature for brainstorming and a risk for facts.</p>
<h3>Where it is useful</h3>
<ul>
<li>First drafts: emails, job adverts, product descriptions, training material.</li>
<li>Summaries of long documents, meetings and customer feedback.</li>
<li>Variations: ten headline options, five image concepts.</li>
<li>Translation and rewriting for different audiences.</li>
</ul>
<h3>Where it goes wrong</h3>
<ul>
<li><strong>Hallucination</strong>: confident, fluent, false content, such as a policy clause that does not exist.</li>
<li><strong>Intellectual property</strong>: questions about what it was trained on and who owns the output.</li>
<li><strong>Bias and stereotypes</strong> copied from training data (“show a CEO”).</li>
<li><strong>Deepfakes and fraud</strong>: fake voices and videos of real people.</li>
</ul>
<blockquote>AI drafts; people decide.</blockquote>`,
example:{title:'Writing 500 product descriptions', html:`<p><strong>Before:</strong> a copywriter spends about 10 minutes per description. 500 × 10 minutes ≈ 83 hours.</p><p><strong>After:</strong> a generative model drafts each description from the product’s attributes (size, material, origin). A copywriter reviews and edits each one in about 2 minutes. 500 × 2 minutes ≈ 17 hours, plus a few hours setting up the prompt and checking samples.</p><p>The saving is real, but it comes from <em>faster review</em>, not from removing the reviewer. One unchecked description claiming “organic” when the product is not can become a legal problem.</p>`},
terms:[['Generative model','A model that produces new content such as text, images, audio or code.'],['Discriminative model','A model that sorts or scores existing inputs, for example spam or not spam.'],['Hallucination','Confident, fluent output that is false or made up.'],['Diffusion model','An image generator that turns random noise into a picture step by step.'],['Deepfake','Generated audio or video that imitates a real person.']],
takeaways:['Generative AI creates rather than classifies.','It builds output piece by piece from learned likelihoods, so results vary.','Great for drafts and variations; always review facts, claims and tone.'],
inst:{purpose:'Post-lunch energy slot. Keep it hands-on and make the risks memorable.',
flow:[['0–5','Energiser: human generator. Start a sentence; each trainee adds one word. Point out it made sense locally but wandered overall.'],['5–15','Classify vs create; diffusion as a developing photograph.'],['15–27','Try it: Mini generator. Trainees generate announcements, then add their own sentences and retrain.'],['27–37','Uses and risks; walk through the 500 descriptions maths. Ask where a hallucination would hurt most.'],['37–45','Check (5 questions).']],
say:['“It’s the world’s fastest first-draft writer, and it has never checked a fact in its life.”','“Different answer every time is great for brainstorming and bad for policy.”','“AI drafts; people decide. Write that down.”'],
ask:['Which weekly writing task in your job would you hand to a first-draft writer?','What is the worst thing a confident wrong answer could do in your area?'],
watch:['“It searches the internet and copies.” It generates from learned patterns; that is why it can invent things.','“If it sounds confident, it is correct.” Fluency and accuracy are unrelated.','“Generated content is automatically free to use.” Check your organisation’s policy.'],
tips:['The human-generator energiser is the best bridge into M6; refer back to it there.','In the Mini generator, point out sentences that were never in the training text.','Avoid live deepfake demos of real people.'],
materials:['Nothing extra; optional live access to an approved generative tool']},
acts:['generator'],
quiz:[
 {q:'What is the key difference between a classifier and a generative model?', o:['A classifier sorts inputs into categories; a generative model produces new content','A classifier is always more accurate','Generative models only work on numbers','There is no difference'], a:0, why:'Which bucket? versus make me one.'},
 {q:'A hallucination is…', o:['A model crash','Confident, fluent content that is false','A very creative image','A slow response'], a:1, why:'Fluent does not mean true.'},
 {q:'The best practice for using generative AI on customer-facing text is…', o:['Publish directly to save time','AI drafts, and a person reviews before it goes out','Never use it','Only use it for internal jokes'], a:1, why:'The saving comes from faster review, not from skipping review.'},
 {q:'Diffusion image generators start from…', o:['A blank white page','Random noise that is refined step by step','A photo of the user','A spreadsheet'], a:1, why:'They remove noise gradually, guided by the description.'},
 {q:'Which task is least suited to generative AI on its own?', o:['Drafting a job advert','Brainstorming campaign names','Calculating exact payroll tax','Summarising meeting notes'], a:2, why:'Exact, legally defined calculations belong to rules.'}

{id:'m5', code:'M5', title:'Foundation Models: Train Once, Reuse Everywhere', rung:5, start:'13:40', end:'14:15', mins:35, methods:['Lecture','Activity','Discussion'],
objectives:['Define a foundation model and why it changed AI economics','Choose between prompting, retrieval and fine-tuning','Explain why the model and the company using it are separate assets'],
notes:`
<h3>The big idea</h3>
<p>Before foundation models, every task needed its own model: one for spam, one for forecasting, one for translation, each with its own data and team. A <strong>foundation model</strong> flips this. You train <strong>one very large, general-purpose model</strong> on a broad slice of the world’s text, images and code, then <strong>adapt</strong> it to hundreds of tasks.</p>
<p><strong>Analogy:</strong> a power grid. Building the power station is enormously expensive and only a few organisations do it. After that, millions of appliances plug in and each does something different.</p>
<p>Another way to see it: a graduate with a broad education can be briefed for many jobs in days. You do not need to raise a new person from birth for each role.</p>
<h3>The economics</h3>
<p>Training a frontier model costs hundreds of millions of dollars in computing, data and talent. Only a handful of companies do it. Everyone else <strong>rents access</strong> through an API (a way for software to call the model over the internet) or runs an <strong>open-weight</strong> model, one whose internal settings are published so you can host it yourself.</p>
<h3>Three ways to adapt a foundation model</h3>
<div class="tbl-wrap"><table class="mini"><thead><tr><th>Method</th><th>What it is</th><th>Like…</th><th>Use when</th></tr></thead><tbody>
<tr><td><strong>Prompting</strong></td><td>Instructions and examples in the request</td><td>Briefing a capable temp worker</td><td>Always try first. Tone, format, simple tasks.</td></tr>
<tr><td><strong>Retrieval (RAG)</strong></td><td>The system looks up your documents and hands the relevant passages to the model</td><td>An open-book exam</td><td>Answers must come from your own, changing information.</td></tr>
<tr><td><strong>Fine-tuning</strong></td><td>Extra training on many of your examples</td><td>A specialist course</td><td>You need a very consistent style or niche skill, and have thousands of examples.</td></tr></tbody></table></div>
<p>Choose the lightest method that works. Most business uses need prompting plus retrieval.</p>
<h3>The model and the company are separate assets</h3>
<p>The model is the engine. The product built around it, including the data, the workflow, the trust and the customer relationships, is the car. Two companies using the same model can build very different businesses.</p>
<ul>
<li><strong>Durable advantages</strong>: your own data, deep integration into daily work, trusted brand, distribution.</li>
<li><strong>Risks</strong>: dependence on a vendor, price changes, a model update that changes behaviour, data leaving your control.</li>
</ul>`,
example:{title:'One model, many jobs in a retail company', html:`<p>A single foundation model, adapted differently each time, can answer HR policy questions (retrieval over the handbook), draft supplier emails (prompting with a house style), summarise thousands of customer reviews (prompting), translate store notices into five languages (prompting), and explain why a forecast changed (retrieval over forecast data). Five products, one engine.</p>`},
terms:[['Foundation model','A very large general-purpose model trained once on broad data and adapted to many tasks.'],['API','A way for one piece of software to call another over the internet, for example to send a question to a model.'],['Open-weight model','A model whose internal settings are published so you can run it yourself.'],['Prompting','Steering a model with instructions and examples in the request.'],['Retrieval-augmented generation (RAG)','Looking up relevant documents and giving them to the model so it answers from them.'],['Fine-tuning','Additional training on your own examples to specialise a model.']],
takeaways:['One expensive model, trained once, now powers thousands of products.','Adapt with prompting first, then retrieval, then fine-tuning if really needed.','Your advantage is your data and workflow, not the engine.'],
inst:{purpose:'Explain why AI suddenly became cheap for everyone else, and what that means for strategy.',
flow:[['0–5','Bridge: “Why can a small start-up launch an AI product in a month?”'],['5–15','Foundation model idea, power-grid analogy, economics.'],['15–25','Try it: Build or reuse calculator, then the Adaptation picker.'],['25–31','Discussion: two retailers use the same model. Why would one win?'],['31–35','Check (5 questions).']],
say:['“Most of us will never build an engine. We will build very good cars.”','“Try the lightest adaptation first. Prompting is free; fine-tuning is not.”','“RAG is an open-book exam. The book is your company’s documents.”'],
ask:['What data does your company have that nobody else has?','What would happen to your product if your model vendor doubled its price?'],
watch:['“We need to train our own model.” Almost never, for most companies.','“Fine-tuning teaches it our facts.” Retrieval is usually better for facts that change.','“The model is the product.” The workflow around it is.'],
tips:['Calculator figures are illustrative; invite trainees to plug in guesses for their own organisation.','This is a short module. Keep the discussion to one question.'],
materials:['Nothing extra']},

 {q:'Giving the model your policy documents to look up while it answers is…', o:['Fine-tuning','Retrieval (RAG)','Overfitting','Diffusion'], a:1, why:'Retrieval hands relevant passages to the model at question time.'},
 {q:'Which adaptation should you usually try first?', o:['Fine-tuning','Training a new model','Prompting','Buying GPUs'], a:2, why:'Prompting is the cheapest and fastest; move up only if needed.'},
 {q:'Why do only a few companies build frontier foundation models?', o:['It is illegal for others','Training costs and computing needs are enormous','They are easy to build','Nobody else wants to'], a:1, why:'Hundreds of millions of dollars of compute, data and talent.'},

{id:'m6', code:'M6', title:'Large Language Models: The Text Specialists', rung:6, start:'14:15', end:'15:05', mins:50, methods:['Lecture','Activity','Practice'],
objectives:['Explain next-token prediction in plain words','Use the terms token, context window, temperature and knowledge cutoff','Explain why LLMs hallucinate and how to reduce it','Write a strong prompt with the CRAFT pattern'],
notes:`
<h3>What an LLM is</h3>
<p>A large language model is a foundation model trained on a vast amount of text to do one simple thing: <strong>predict the next piece of text</strong>. Given “The store will be closed on Monday for…”, it estimates how likely each possible next word is, picks one, adds it, and repeats.</p>
<p>That sounds too simple to be useful. But to predict the next word well across billions of pages, a model has to absorb grammar, facts, styles, and patterns of reasoning. At large scale, summarising, translating, drafting, answering and coding all emerge from that one skill. Your phone’s autocomplete does the same job with a tiny model; an LLM does it with a vast one.</p>
<h3>Four words you need</h3>
<ul>
<li><strong>Token</strong>: text is chopped into chunks, often part of a word. “Unbelievable” might be “un-believ-able”. A rough guide is 100 tokens ≈ 75 English words.</li>
<li><strong>Context window</strong>: how much text the model can consider at once, including your question, any documents and its own answer. Think of it as the size of the desk it works on.</li>
<li><strong>Temperature</strong>: how adventurous its word choices are. Low gives predictable, consistent answers. High gives varied, creative ones.</li>
<li><strong>Knowledge cutoff</strong>: the model only knows the world up to when its training data was collected, unless it is given tools like search or your documents.</li>
</ul>
<h3>Why LLMs hallucinate</h3>
<p>An LLM is optimised to produce <em>plausible</em> text, not to look things up. If it lacks the fact, it can fill the gap with something that sounds right. It has no built-in sense of “I don’t know”.</p>
<p>How to reduce it:</p>
<ul>
<li>Give it the source text and ask it to answer only from that.</li>
<li>Ask it to quote or cite the passage it used.</li>
<li>Use low temperature for factual work.</li>
<li>Check anything that matters, especially numbers, names, dates and legal claims.</li>
</ul>
<h3>Prompting that works: CRAFT</h3>
<ul>
<li><strong>C</strong>ontext: the situation and background facts.</li>
<li><strong>R</strong>ole: who the model should act as.</li>
<li><strong>A</strong>sk: the specific task.</li>
<li><strong>F</strong>ormat: length, structure, headings, bullets.</li>
<li><strong>T</strong>one and limits: voice, audience, what not to say.</li>
</ul>
<p>A prompt is a briefing. Brief it like you would brief a smart new colleague who knows nothing about your company.</p>`,
example:{title:'Weak prompt vs strong prompt', html:`<p><strong>Weak:</strong> “Write an email about the schedule change.”</p><p><strong>Strong:</strong> “Our Pune store is moving Saturday opening from 8:00 to 9:00 from 12 October because early footfall is low; 40 associates are affected (context). You are an HR communications specialist (role). Write an email to associates announcing the change and what it means for their shifts (ask). Subject line plus under 150 words, with a three-bullet ‘what changes for you’ section (format). Warm and clear, no jargon; don’t promise any pay changes; say to contact the store manager, Anita (tone and limits).”</p><p>The strong version takes a minute longer to write and saves three rounds of edits.</p>`},
terms:[['Large language model (LLM)','A foundation model specialised in text, trained to predict the next token.'],['Token','A chunk of text, often part of a word, that the model reads and writes.'],['Context window','The maximum amount of text the model can consider at once.'],['Temperature','A setting controlling how varied or predictable word choices are.'],['Knowledge cutoff','The date after which the model has no training data.'],['Prompt','The instructions and information you give the model.']],
takeaways:['LLMs generate text by repeatedly predicting a likely next token.','They are fluent, not factual. Ground them in sources and check what matters.','A good prompt is a good briefing: use CRAFT.'],
inst:{purpose:'Demystify chat assistants and give trainees a skill they can use tomorrow morning.',
flow:[['0–5','Hook: type a phrase on your phone and keep tapping the middle suggestion. Read out the result. “That’s a tiny language model.”'],['5–15','Next-token prediction, tokens, context window. Refer back to the human-generator energiser from M4.'],['15–25','Try it: Next-word game. Move temperature from 0.1 to 2. Ask what setting they would want for HR policy answers.'],['25–32','Hallucination and knowledge cutoff. Show one real hallucination if you have a safe example.'],['32–45','Try it: CRAFT builder. Pairs write a prompt for a real task from their job, then swap and critique.'],['45–50','Check (5 questions).']],
say:['“It’s autocomplete that read the library.”','“It is optimised to sound right, not to be right. Your job is the ‘be right’ part.”','“Brief it like a smart new starter who has never seen your company.”'],
ask:['What is a task you do every week that is mostly writing?','What would you need to paste into the prompt so it could answer from facts instead of guessing?'],
watch:['“It looks things up on the internet.” Only if it has a search tool; otherwise it generates from training.','“It remembers our last conversation.” Only within its context window, or if a memory feature is switched on.','“It understands like a person.” Reasonable people disagree; what matters is testing it on your task.'],
tips:['This is the module trainees will use most. Protect the CRAFT practice time.','Collect the best prompts from pairs and share them after the course.','If you have approved access to a real assistant, run the weak and strong prompts live.'],
materials:['Your phone for the autocomplete hook','Optional: approved LLM tool on screen']},

 {q:'At its core, an LLM is trained to…', o:['Predict the next token','Store every web page','Follow hand-written grammar rules','Search a database'], a:0, why:'Everything else emerges from next-token prediction at scale.'},
 {q:'Raising the temperature makes answers…', o:['More predictable','More varied and creative, less predictable','Shorter','More accurate'], a:1, why:'Higher temperature spreads probability to less likely words.'},
 {q:'The context window is…', o:['The chat app’s screen size','How much text the model can consider at once','The model’s training date','A security setting'], a:1, why:'Think of it as the size of the model’s desk.'},
 {q:'The best way to reduce hallucination about company policy is to…', o:['Ask the question in capital letters','Give the model the policy text and ask it to answer only from it and cite the passage','Raise the temperature','Ask it to be confident'], a:1, why:'Grounding in the source plus citations lets you verify.'},
 {q:'Which change most improves the prompt “Write a summary”?', o:['Adding “please”','Adding the context, the audience and the format needed','Making it shorter','Adding emojis'], a:1, why:'Context, audience and format are the CRAFT elements that matter most.'}
]},

{id:'m7', code:'M7', title:'Multimodal Models: Beyond Text', rung:7, start:'15:20', end:'15:50', mins:30, methods:['Demo','Activity'],
objectives:['Define multimodal and give workplace examples','Explain in plain words how one model relates images, sound and text','Name the specific risks of multimodal AI'],
notes:`
<h3>What multimodal means</h3>
<p>A <strong>modality</strong> is a type of data: text, images, audio, video. A <strong>multimodal</strong> model handles several of them together, both as input and output. It is like a colleague who can read the report, look at the photo and listen to the voicemail at the same time, and connect them.</p>
<h3>How it works, simply</h3>
<p>Each input is turned into the same internal “language” of numbers. A photo of a spill, the spoken word “spill” and the written word “hazard” end up close together in that space. That shared space is what lets the model answer a spoken question about a picture.</p>
<h3>Everyday uses</h3>
<ul>
<li>Photograph a shelf and ask which products are running low.</li>
<li>Snap a supplier invoice and pull out the amount, date and number.</li>
<li>Dictate a voice note on a store walk and get a structured checklist.</li>
<li>Summarise video footage of a loading-dock incident.</li>
<li>Describe product photos aloud for a visually impaired shopper.</li>
<li>Live translation of a spoken conversation.</li>
</ul>
<h3>Cautions</h3>
<ul>
<li><strong>Privacy and consent</strong>: photos and recordings capture faces, voices and names of people who never agreed.</li>
<li><strong>Visual mistakes</strong>: miscounting items, misreading small print or handwriting.</li>
<li><strong>Deepfakes</strong>: realistic fake audio and video are now cheap to make. Verify unusual requests through a second channel.</li>
</ul>`,
example:{title:'The hands-free store walk', html:`<p>A district manager walks a store, talking into their phone and snapping photos: “Freezer door in aisle 9 isn’t sealing… end-cap display is still last week’s promotion…” A multimodal model turns the voice note and photos into a visit report: issues listed by priority, each with its photo attached, and a draft task for the store manager. What used to take an hour of typing after the visit now takes a few minutes of checking.</p>`},
terms:[['Modality','A type of data: text, image, audio or video.'],['Multimodal model','A model that works across more than one modality.'],['Speech-to-text','Turning spoken audio into written text.'],['Text-to-speech','Turning written text into spoken audio.'],['OCR','Optical character recognition: reading printed or handwritten text from images.']],
takeaways:['Multimodal models connect text, images, audio and video in one system.','They unlock hands-free and camera-based work.','They raise sharper privacy and deepfake risks.'],
inst:{purpose:'Show the widening range of inputs, and prepare the ground for agents.',
flow:[['0–8','Teach with a live demo if you have an approved tool: photograph something in the room and ask a question about it.'],['8–20','Try it: Modality matcher, in pairs.'],['20–26','Cautions: privacy, visual errors, deepfakes. Tell the story of a “CEO voice” fraud call.'],['26–30','Check (4 questions).']],
say:['“Everything becomes numbers in the same space. That’s how a picture and a sentence can be compared.”','“If a video of your boss asks for an urgent transfer, call your boss.”'],
ask:['Which part of your job would be easier if you could just point your phone at it?','Whose faces or voices might your photos capture without consent?'],
watch:['“It sees perfectly.” It miscounts and misreads, especially small text.','“Multimodal means many models glued together.” Increasingly it is one model.'],
tips:['After the afternoon break energy is low; get people standing and photographing something.','Do not photograph trainees without consent, even for a demo.'],
materials:['Optional: approved multimodal tool and a few objects to photograph']},
acts:['modality'],
quiz:[
 {q:'A multimodal model is one that…', o:['Handles several types of data such as text, images and audio','Has many users','Runs on many computers','Only works with video'], a:0, why:'Modality means a type of data.'},
 {q:'Photographing an invoice and extracting the total uses which modalities?', o:['Audio only','Image and text','Video only','None'], a:1, why:'An image goes in; text comes out.'},
 {q:'A risk that is sharper for multimodal AI is…', o:['It cannot write text','Privacy of faces and voices captured in images and recordings','It is always slower','It needs rules'], a:1, why:'Images and audio capture people who may not have consented.'},
 {q:'How does a multimodal model relate a photo to a sentence?', o:['It prints both and compares','It converts both into a shared internal representation of numbers','A person labels each photo live','It cannot'], a:1, why:'A shared numerical space lets different inputs be compared.'}
]},

{id:'m8', code:'M8', title:'AI Agents: From Answering to Acting', rung:8, start:'15:50', end:'16:25', mins:35, methods:['Lecture','Simulation','Discussion'],
objectives:['Explain what makes an agent different from a chatbot','Describe the plan–act–observe loop','Choose an autonomy level and human checkpoints for a task','Explain why errors compound over many steps'],
notes:`
<h3>From answering to acting</h3>
<p>A chatbot <strong>answers</strong>. An agent <strong>acts</strong>. An AI agent is a system given a <strong>goal</strong>, a set of <strong>tools</strong> (calendar, email, databases, the web, your scheduling system) and <strong>permission</strong> to take steps. It works in a loop:</p>
<ol><li><strong>Plan</strong>: break the goal into steps.</li><li><strong>Act</strong>: use a tool.</li><li><strong>Observe</strong>: read the result.</li><li><strong>Adjust</strong>: change the plan if needed, and repeat until done or stuck.</li></ol>
<p><strong>Analogy:</strong> an encyclopedia versus a capable intern with logins. The encyclopedia tells you things. The intern gets things done, and can also make mistakes inside your real systems.</p>
<h3>Levels of autonomy</h3>
<div class="tbl-wrap"><table class="mini"><thead><tr><th>Level</th><th>What the agent does</th><th>Like driving with…</th></tr></thead><tbody>
<tr><td>1. Suggest</td><td>Recommends; you do it</td><td>A sat-nav giving directions</td></tr>
<tr><td>2. Draft for approval</td><td>Prepares the action; a person confirms</td><td>Parking assist that asks before steering</td></tr>
<tr><td>3. Act with oversight</td><td>Acts on reversible tasks; you are notified and can undo</td><td>Lane-keeping with your hands on the wheel</td></tr>
<tr><td>4. Act autonomously</td><td>Acts alone within strict limits</td><td>A self-driving shuttle on a fixed route</td></tr></tbody></table></div>
<h3>Why agents are hard</h3>
<ul>
<li><strong>Errors compound.</strong> If each step is 95% reliable, ten steps in a row succeed only about 60% of the time.</li>
<li><strong>Permissions.</strong> An agent with access to email and payroll can do real damage if it is wrong or tricked.</li>
<li><strong>Accountability.</strong> When the agent acts, a named person is still responsible.</li>
<li><strong>Cost.</strong> Many steps mean many model calls.</li>
</ul>
<h3>Designing agents responsibly</h3>
<ul>
<li><strong>Least privilege</strong>: give only the access the task needs.</li>
<li><strong>Human checkpoints</strong> before actions that are irreversible, costly, or affect people.</li>
<li><strong>Logs</strong> of every step, so you can see what happened.</li>
<li><strong>Clear stop conditions</strong>: when to give up and hand over to a person.</li>
</ul>`,
example:{title:'Finding cover for a sick associate', html:`<p>Sam calls in sick for Saturday’s 9:00–17:00 bakery shift. An agent reads the schedule, finds associates trained for the bakery who are free, checks labour rules and overtime, ranks candidates, messages the best one, waits for a reply, updates the schedule, and tells the manager. A person should approve the steps that contact staff, cost money, or change the official schedule. You will run this in Try it.</p>`},

function practiceQuiz(root, qs, id){
  root.innerHTML = '';
  const wrap = el('<div class="quiz"></div>'); root.appendChild(wrap);
  let answered = 0, correct = 0;
  qs.forEach((q, qi) => {
    const card = el(`<div class="qcard"><span class="qn">Question ${qi + 1} of ${qs.length}</span><div class="qq">${esc(q.q)}</div><div class="opts">${q.o.map((o, oi) => `<button class="opt" data-i="${oi}"><span class="k">${'ABCD'[oi]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`);
    $$('.opt', card).forEach(b => b.addEventListener('click', () => {
      const pick = +b.dataset.i, ok = pick === q.a;
      $$('.opt', card).forEach(x => { x.disabled = true; const i = +x.dataset.i; if (i === q.a) x.classList.add('right'); else if (i === pick) x.classList.add('wrong'); });
      card.appendChild(el(`<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? 'Correct.' : 'Not quite.'}</b> ${esc(q.why)}</div>`));
      answered++; if (ok) correct++;
      if (answered === qs.length) finish();
    }));
    wrap.appendChild(card);
  });
  function finish(){
    const prev = S.scores[id];
    if (!prev || correct > prev.score) S.scores[id] = {score:correct, total:qs.length};
    store.set('scores', S.scores); renderNav(current);
    const box = el(`<div class="scorebox"><span class="big">${correct}/${qs.length}</span><div class="stack" style="gap:4px"><b>${correct === qs.length ? 'Full marks.' : correct >= Math.ceil(qs.length * .7) ? 'Good work.' : 'Worth another look at the notes.'}</b><span class="muted">Best score saved: ${S.scores[id].score}/${qs.length}</span></div><button class="btn ghost" style="margin-left:auto">Try again</button></div>`);
    $('button', box).addEventListener('click', () => practiceQuiz(root, qs, id));
    wrap.appendChild(box);
    box.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block:'nearest'});
  }
}

  const f = el(`<div class="grid2"><div class="field"><label for="rbPos">Happy words (comma separated)</label><input id="rbPos" value="great, friendly, loved, good, helpful"></div><div class="field"><label for="rbNeg">Unhappy words</label><input id="rbNeg" value="bad, not, wrong, queue, overcharged"></div></div>`);

ACT.pixels = body => {
  const N = 9, cells = new Array(N * N).fill(false), C = 4;
  const T = { V:[], H:[], D1:[], D2:[], R:[] };
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const i = r * N + c; if (c === C) T.V.push(i); if (r === C) T.H.push(i); if (r === c) T.D1.push(i); if (r + c === N - 1) T.D2.push(i);
    const d = Math.hypot(r - C, c - C); if (d >= 2.6 && d <= 3.6) T.R.push(i);
  }
  const near = i => { const r = Math.floor(i / N), c = i % N; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++){ const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < N && cc >= 0 && cc < N && cells[rr * N + cc]) return true; } return false; };
  const recall = t => t.filter(near).length / t.length;
  body.appendChild(el('<p>Draw on the grid, or load a shape. <b>Layer 1</b> has six simple detectors that each look for one stroke. <b>Layer 2</b> combines their signals into a guess. Real networks have millions of units, but the idea is the same. Challenge: can you fool it?</p>'));
  const lay = el(`<div class="pix-layout"><div class="stack"><div class="pgrid" role="grid" aria-label="Drawing grid, 9 by 9">${cells.map((_, i) => `<div data-i="${i}"></div>`).join('')}</div>
    <div class="row">${['Plus','Cross','Circle','Messy plus','Clear'].map(x => `<button class="chipbtn" data-p="${x}">${x}</button>`).join('')}</div></div>
    <div class="stack"><h4>Layer 1 · simple features</h4><div class="bars" id="l1"></div><h4 style="margin-top:8px">Layer 2 · the guess</h4><div class="bars" id="l2"></div><p class="muted" id="pxMsg" aria-live="polite"></p></div></div>`);
  body.appendChild(lay);
  const grid = $('.pgrid', lay), divs = $$('.pgrid div', lay);
  const barRow = (lbl, v, warm) => `<div class="bar"><span>${lbl}</span><span class="tr"><i class="${warm ? 'w' : ''}" style="width:${Math.round(v * 100)}%"></i></span><span class="pct">${Math.round(v * 100)}%</span></div>`;
  function compute(){
    divs.forEach((d, i) => d.classList.toggle('on', cells[i]));
    const n = cells.filter(Boolean).length;
    const V = recall(T.V), H = recall(T.H), D1 = recall(T.D1), D2 = recall(T.D2), R = recall(T.R);
    let cen = 0; for (let r = 3; r <= 5; r++) for (let c = 3; c <= 5; c++) if (cells[r * N + c]) cen++;
    const Cn = Math.min(1, cen / 4);
    $('#l1', lay).innerHTML = [['Vertical stroke', V], ['Horizontal stroke', H], ['Diagonal ↘', D1], ['Diagonal ↙', D2], ['Ring', R], ['Ink in centre', Cn]].map(x => barRow(x[0], n ? x[1] : 0)).join('');
    if (!n){ $('#l2', lay).innerHTML = [['Plus', 0], ['Cross', 0], ['Circle', 0]].map(x => barRow(x[0], x[1], true)).join(''); $('#pxMsg', lay).textContent = 'Draw something to see the network respond.'; return; }
    const raw = [Math.min(V, H) * Cn, Math.min(D1, D2) * Cn, R * (1 - Cn)];
    const ex = raw.map(s => Math.exp(8 * s)), sum = ex.reduce((a, c) => a + c, 0), pr = ex.map(e => e / sum);
    const names = ['Plus', 'Cross', 'Circle'];
    $('#l2', lay).innerHTML = names.map((x, i) => barRow(x, pr[i], true)).join('');
    const best = pr.indexOf(Math.max(...pr));
    $('#pxMsg', lay).textContent = pr[best] > .6 ? `The network is fairly sure this is a ${names[best].toLowerCase()}.` : 'The network is unsure. Its features don’t clearly add up to any shape it knows.';
  }
  let drawing = false, paint = true;
  const at = e => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.parentNode === grid ? +t.dataset.i : -1; };
  grid.addEventListener('pointerdown', e => { const i = at(e); if (i < 0) return; drawing = true; paint = !cells[i]; cells[i] = paint; try { grid.setPointerCapture(e.pointerId); } catch(_){} compute(); e.preventDefault(); });
  grid.addEventListener('pointermove', e => { if (!drawing) return; const i = at(e); if (i >= 0 && cells[i] !== paint){ cells[i] = paint; compute(); } });
  const stop = () => { drawing = false; }; grid.addEventListener('pointerup', stop); grid.addEventListener('pointercancel', stop);
  $$('[data-p]', lay).forEach(b => b.addEventListener('click', () => {
    cells.fill(false); const p = b.dataset.p;
    if (p === 'Plus') T.V.concat(T.H).forEach(i => cells[i] = true);
    if (p === 'Cross') T.D1.concat(T.D2).forEach(i => cells[i] = true);
    if (p === 'Circle') T.R.forEach(i => cells[i] = true);
    if (p === 'Messy plus'){ T.V.concat(T.H).forEach((i, k) => { if (k % 4 !== 1) cells[i] = true; }); [2, 15, 60, 70].forEach(i => cells[i] = true); }
    compute();
  }));
  compute();
};

ACT.generator = body => {

  body.appendChild(el('<p>This tiny model has read only the announcements below. For each word, it learned which words tend to follow. To generate, it starts at the beginning and keeps picking a likely next word. Many results are sentences it has never seen.</p>'));
  const out = el('<div class="panel flat stack" style="padding:16px;border:1px solid var(--line)"><div class="gen-out" aria-live="polite">Press Generate.</div><div class="row" id="gTag"></div><div class="trace" id="gTrace"></div></div>');
  body.appendChild(out);
  const ctl = el('<div class="row"><button class="btn acc" id="gGo">Generate</button><button class="btn ghost" id="gFive">Generate five</button></div>'); body.appendChild(ctl);
  const five = el('<ul class="inst-list" id="gList"></ul>'); body.appendChild(five);
  const tr = el(`<details><summary style="cursor:pointer;font-weight:700">Training text (edit it and retrain)</summary><div class="stack" style="margin-top:10px"><textarea id="gCorpus" rows="8">${base.join('\n')}</textarea><div class="row"><button class="btn ghost" id="gTrain">Retrain on this text</button><span class="muted" id="gInfo"></span></div></div></details>`);

  function train(){
    const lines = $('#gCorpus', tr).value.toLowerCase().split('\n').map(s => s.replace(/[^a-z0-9' ]/g, ' ').trim().replace(/\s+/g, ' ')).filter(Boolean);
    map = {}; seen = new Set(lines);
    lines.forEach(l => { const w = ['^'].concat(l.split(' '), ['$']); for (let i = 0; i < w.length - 1; i++){ (map[w[i]] = map[w[i]] || []).push(w[i + 1]); } });
    const nw = new Set(lines.join(' ').split(' ').filter(Boolean)).size;
    $('#gInfo', tr).textContent = lines.length ? `Learned from ${lines.length} sentence${lines.length === 1 ? '' : 's'} and ${nw} different words.` : 'No sentences to learn from. Add at least one, then press Retrain.';
  }
  function gen(){
    let w = '^'; const words = [], trace = [];
    for (let k = 0; k < 20; k++){ const opts = map[w]; if (!opts) break; const pick = opts[Math.floor(Math.random() * opts.length)]; if (pick === '$') break; words.push(pick); trace.push([pick, new Set(opts).size]); w = pick; }
    const s = words.join(' ');
    return {s, trace, novel: !seen.has(s)};
  }
  const fmt = s => s ? s.charAt(0).toUpperCase() + s.slice(1) + '.' : '(empty)';
  const empty = () => { $('.gen-out', out).textContent = 'Nothing to generate yet.'; $('#gTag', out).innerHTML = '<span class="pill no">The model has no training text. Open “Training text”, add sentences and press Retrain.</span>'; $('#gTrace', out).innerHTML = ''; five.innerHTML = ''; };
  $('#gGo', ctl).addEventListener('click', () => {
    if (!map['^']) return empty();
    const g = gen(); $('.gen-out', out).textContent = fmt(g.s);
    $('#gTag', out).innerHTML = g.novel ? '<span class="pill warm">New sentence, not in the training text</span>' : '<span class="pill">Repeats a training sentence</span>';
    $('#gTrace', out).innerHTML = g.trace.map(t => `<span title="${t[1]} possible words at this step">${esc(t[0])}<sub>${t[1]}</sub></span>`).join('') + '<span class="muted" style="background:transparent">small numbers = how many words it could have picked</span>';
  });
  $('#gFive', ctl).addEventListener('click', () => { if (!map['^']) return empty(); five.innerHTML = Array.from({length:5}, () => { const g = gen(); return `<li>${esc(fmt(g.s))} ${g.novel ? '<span class="pill warm">new</span>' : '<span class="pill">copy</span>'}</li>`; }).join(''); });
  $('#gTrain', tr).addEventListener('click', () => { train(); $('.gen-out', out).textContent = map['^'] ? 'Retrained. Press Generate.' : 'Nothing to generate yet.'; $('#gTag', out).innerHTML = ''; $('#gTrace', out).innerHTML = ''; five.innerHTML = ''; });
  train();
};

function pageExam(v){
  const page = el(`<div class="page"><header class="mhead"><span class="eyebrow">Assessment</span><h1>Final assessment</h1>
    <p class="lede col">25 multiple-choice questions drawn from a bank of ${Object.values(FINAL_BANK).reduce((s, a) => s + a.length, 0)}, weighted by module. 20 minutes. Pass mark 70% (18 of 25). Closed book, individual.</p></header><div id="exBody" class="stack" style="gap:18px"></div></div>`);
  v.appendChild(page);
  const b = $('#exBody', page);
  const intro = () => {
    b.innerHTML = '';
    const bp = BLUEPRINT.map(x => `<tr><td>${modById(x[0]).code} ${esc(modById(x[0]).title)}</td><td class="num">${x[1]}</td></tr>`).join('');
    b.appendChild(el(`<div class="grid2">
      <div class="panel stack"><h3>Before you start</h3><ul class="inst-list"><li>Each attempt draws a fresh set of questions and shuffles the answers.</li><li>The timer counts down from 20:00 and submits automatically at zero.</li><li>Your answers are saved as you go. If you leave this page or refresh, you can carry on, but the timer keeps running.</li><li>You get your score, a module breakdown and explanations at the end.</li><li>Trainees with an approved accommodation get 25% extra time: tick the box below.</li></ul>
      ${S.exam ? `<p><span class="pill ${S.exam.best >= 70 ? 'ok' : 'no'}">Best so far: ${S.exam.best}%</span> <span class="muted">${S.exam.attempts} attempt${S.exam.attempts === 1 ? '' : 's'}</span></p>` : ''}
      <label class="row" style="gap:8px"><input type="checkbox" id="exExtra"> Extra time (25 minutes)</label>
      <div><button class="btn acc" id="exStart">Start the assessment</button></div></div>
      <div class="panel stack"><h3>What is covered</h3><div class="tbl-wrap"><table class="mini"><thead><tr><th>Module</th><th>Questions</th></tr></thead><tbody>${bp}</tbody></table></div></div></div>`));
    $('#exStart', b).addEventListener('click', () => start($('#exExtra', b).checked ? 25 : 20));
  };
  function start(mins){
    const qs = [];
    BLUEPRINT.forEach(([mid, n]) => shuffle(FINAL_BANK[mid]).slice(0, n).forEach(q => {
      const opts = shuffle(q.o.map((t, i) => ({t, c: i === q.a})));
      qs.push({mid, q:q.q, why:q.why, opts:opts.map(o => o.t), a: opts.findIndex(o => o.c)});
    }));
    const run = {qs, ans: qs.map(() => -1), deadline: Date.now() + mins * 60000};
    store.set('examRun', run);
    renderRun(run, false);
  }
  function renderRun(run, resumed){
    const qs = run.qs;
    b.innerHTML = '';
    if (resumed) b.appendChild(el('<p class="resume-note"><b>Assessment resumed.</b> Your saved answers are back. The timer kept running while you were away.</p>'));
    const timer = el('<div class="timer"><span>Answered <b id="exAns">0</b> of 25</span><span class="num" id="exClock" aria-live="off"></span></div>');
    b.appendChild(timer);
    const form = el(`<div class="quiz">${qs.map((q, i) => `<div class="qcard" id="exq${i}"><span class="qn">Question ${i + 1} of 25 · ${modById(q.mid).code}</span><div class="qq">${esc(q.q)}</div><div class="opts exam-opts">${q.opts.map((o, j) => `<label><input type="radio" name="exq${i}" value="${j}"${run.ans[i] === j ? ' checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div></div>`).join('')}</div>`);
    b.appendChild(form);
    const foot = el('<div class="stack"><div><button class="btn acc" id="exSubmit">Submit assessment</button></div><div id="exConfirm"></div></div>'); b.appendChild(foot);
    const answers = () => qs.map((_, i) => { const r = $(`input[name="exq${i}"]:checked`, form); return r ? +r.value : -1; });
    const count = () => { $('#exAns', timer).textContent = answers().filter(x => x >= 0).length; };
    form.addEventListener('change', () => { run.ans = answers(); store.set('examRun', run); count(); });
    count();
    const clock = () => { const left = Math.max(0, Math.ceil((run.deadline - Date.now()) / 1000)); const mm = Math.floor(left / 60), ss = left % 60; $('#exClock', timer).textContent = mm + ':' + String(ss).padStart(2, '0'); return left; };
    clock();
    window.__examTimer = setInterval(() => { if (clock() <= 0){ clearInterval(window.__examTimer); window.__examTimer = null; finish(run, answers(), true); } }, 1000);
    $('#exSubmit', foot).addEventListener('click', () => {
      const un = answers().filter(x => x < 0).length, cf = $('#exConfirm', foot);
      if (!un) return finish(run, answers(), false);
      cf.innerHTML = ''; const box = el(`<div class="inline-confirm"><b>You have ${un} unanswered question${un === 1 ? '' : 's'}.</b><span>Unanswered questions score zero. Submit anyway?</span><div class="row"><button class="btn acc">Submit now</button><button class="btn ghost">Keep working</button></div></div>`);
      const [yes, no] = $$('button', box); yes.addEventListener('click', () => finish(run, answers(), false)); no.addEventListener('click', () => cf.innerHTML = ''); cf.appendChild(box);
    });
  }
  function finish(run, ans, timeout){
    if (window.__examTimer){ clearInterval(window.__examTimer); window.__examTimer = null; }
    store.set('examRun', null);
    const qs = run.qs; let score = 0; const per = {};
    qs.forEach((q, i) => { per[q.mid] = per[q.mid] || [0, 0]; per[q.mid][1]++; if (ans[i] === q.a){ score++; per[q.mid][0]++; } });
    const pct = Math.round(100 * score / qs.length), pass = pct >= 70;
    const prev = S.exam || {best:0, attempts:0};
    const today = new Date().toISOString().slice(0, 10);
    S.exam = {best: Math.max(prev.best, pct), last: pct, attempts: prev.attempts + 1, date: today, bestDate: pct >= prev.best ? today : prev.bestDate};
    store.set('exam', S.exam); renderNav(current);
    b.innerHTML = '';
    const res = el(`<div class="stack" style="gap:18px">
      <div class="scorebox"><span class="big">${pct}%</span><div class="stack" style="gap:4px"><b>${pass ? (pct >= 90 ? 'Passed at distinction level.' : 'Passed.') : 'Not yet passed.'}</b><span class="muted">${score} of ${qs.length} correct${timeout ? ' · submitted automatically when time ran out' : ''}. Pass mark 70%.</span></div>
      <div class="row" style="margin-left:auto">${pass ? '<a class="btn acc" href="#cert" style="text-decoration:none">Get your certificate</a>' : ''}<button class="btn ghost" id="exAgain">${pass ? 'Take it again' : 'Retake'}</button></div></div>
      <div class="panel stack"><h3>By module</h3><div class="bars">${BLUEPRINT.map(([mid]) => { const p = per[mid]; return `<div class="bar"><span>${modById(mid).code} ${esc(modById(mid).title.split(':')[0])}</span><span class="tr"><i style="width:${100 * p[0] / p[1]}%"></i></span><span class="pct">${p[0]}/${p[1]}</span></div>`; }).join('')}</div>${!pass ? '<p class="muted">Revisit the notes for your lowest modules before retaking. Your certification rules allow one retake within 14 days.</p>' : ''}</div>
      <h3>Review</h3>
      <div class="quiz">${qs.map((q, i) => { const ok = ans[i] === q.a; return `<div class="qcard"><span class="qn">Question ${i + 1} · ${modById(q.mid).code}</span><div class="qq">${esc(q.q)}</div><div class="opts">${q.opts.map((o, j) => `<div class="opt ${j === q.a ? 'right' : (j === ans[i] ? 'wrong' : '')}"><span class="k">${j === q.a ? '✓' : (j === ans[i] ? '✗' : '')}</span><span>${esc(o)}</span></div>`).join('')}</div><div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? 'Correct.' : ans[i] < 0 ? 'Not answered.' : 'Incorrect.'}</b> ${esc(q.why)}</div></div>`; }).join('')}</div></div>`);
    b.appendChild(res);
    $('#exAgain', res).addEventListener('click', intro);
    window.scrollTo(0, 0);
  }
  const run = store.get('examRun', null);
  if (run && run.qs && run.deadline){
    if (Date.now() >= run.deadline) finish(run, run.ans, true);
    else renderRun(run, true);
  } else intro();
}
